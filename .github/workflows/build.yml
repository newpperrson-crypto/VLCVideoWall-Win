name: сборка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Проверка обязательных файлов
        shell: pwsh
        run: |
          $required = @(
            'README.md',
            'CHANGELOG.md',
            'LICENSE',
            'watchdog.ps1',
            'config/Mosaic.conf.example',
            'config/README.txt',
            'docs/configuration.md',
            'docs/troubleshooting.md'
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            Write-Error ('Нет обязательных файлов: ' + ($missing -join ', '))
            exit 1
          }
          Write-Host 'все обязательные файлы на месте'

      - name: Проверка состава публикации
        shell: pwsh
        run: |
          # В публикации допустимы только пользовательские документы из списка.
          # Любой новый файл документации требует явного разрешения владельца проекта.
          $allowed = @(
            'README.md',
            'CHANGELOG.md',
            'LICENSE',
            'docs/configuration.md',
            'docs/troubleshooting.md',
            'config/README.txt'
          )
          $tracked = git ls-files
          $docs = @($tracked | Where-Object { $_ -match '\.(md|markdown|txt)$' })
          $extra = @($docs | Where-Object { $allowed -notcontains $_ })
          if ($extra.Count -gt 0) {
            Write-Host ('Лишние документы в публикации: ' + ($extra -join ', '))
            Write-Error 'В публикацию добавлены документы, которых нет в списке разрешённых.'
            exit 1
          }
          $secret = @($tracked | Where-Object { $_ -match '^(audio-temp/|\.env|.*\.xspf$|Mosaic\.conf$)' })
          if ($secret.Count -gt 0) {
            Write-Host ('В индексе есть служебные файлы: ' + ($secret -join ', '))
            Write-Error 'Служебные и содержащие адреса камер файлы не должны попадать в репозиторий.'
            exit 1
          }
          Write-Host ('документов в публикации: ' + $docs.Count + ', лишних нет')

      - name: Сборка
        run: dotnet build src/VLCVideoWall/VLCVideoWall.csproj -c Release --nologo

      - name: Тесты
        run: dotnet run --project tests/VLCVideoWall.Tests/VLCVideoWall.Tests.csproj -c Release

      - name: Публикация одним файлом
        run: dotnet publish src/VLCVideoWall/VLCVideoWall.csproj -c Release -o dist --nologo

      - name: Проверка артефакта
        shell: pwsh
        run: |
          $required = @('dist/VLCVideoWall.exe', 'watchdog.ps1', 'config/Mosaic.conf.example', 'config/README.txt', 'LICENSE')
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            Write-Error ('В артефакте нет файлов: ' + ($missing -join ', '))
            exit 1
          }
          Write-Host 'артефакт укомплектован'

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: VLCVideoWall-win-x64
          path: |
            dist/VLCVideoWall.exe
            watchdog.ps1
            config/Mosaic.conf.example
            config/README.txt
            LICENSE
          if-no-files-found: error
